<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f5d50">
  <title>Tutor Tracker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232f5d50'/><path d='M8 11l8-4 8 4-8 4z M11 13v5c0 2 10 2 10 0v-5' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar" id="topbar" hidden>
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true"></span>
        <span id="brand-name">Tutor Tracker</span>
      </a>
      <nav class="nav" id="nav">
        <a href="#/" data-nav="dashboard">Dashboard</a>
        <a href="#/sessions" data-nav="sessions">Sessions</a>
        <a href="#/calendar" data-nav="calendar">Calendar</a>
        <a href="#/clients" data-nav="clients">Clients</a>
        <a href="#/settings" data-nav="settings">Settings</a>
      </nav>
      <button class="btn primary add-btn" id="quick-add" type="button">+ Session</button>
    </header>
    <main id="view" class="view" aria-live="polite"></main>
  </div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script>
    // Browsers block JavaScript modules on pages opened straight from disk (file://),
    // which shows up as a "CORS" error. Explain how to open it properly instead.
    if (location.protocol === "file:") {
      document.getElementById("view").innerHTML =
        '<div class="login"><div class="card" style="width:min(560px,100%)">' +
        '<h1>Open this through a local web server</h1>' +
        '<p>This page was opened directly from a file, so your browser blocks its scripts (a CORS error).</p>' +
        '<p><b>Easiest:</b> double-click <code>start-local.bat</code> in the project folder. It opens ' +
        '<code>http://localhost:8801/docs/</code> for you.</p>' +
        '<p>Or, in VS Code, right-click <code>docs/index.html</code> and choose <b>Open with Live Server</b>.</p>' +
        '</div></div>';
    }
  </script>
  <script src="./app.js" type="module"></script>
</body>
</html>
